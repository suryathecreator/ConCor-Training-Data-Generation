[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concor-training-data-generation"
version = "0.1.0"
description = "Generate grounded image-caption correspondences with SAM 3 and Qwen3.8-27B."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "huggingface-hub>=0.34",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "scipy>=1.12",
  "spacy>=3.8,<4",
  "tqdm>=4.66",
  "transformers>=4.56",
  "wn==1.1.0",
]

[project.optional-dependencies]
campaign = ["orjson>=3.10", "pyarrow>=18", "zstandard>=0.23"]
gpu = ["vllm==0.26.0"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
concor = "sam3_mask_captioning.cli:main"

[project.urls]
Repository = "https://github.com/suryathecreator/ConCor-Training-Data-Generation"
Dataset = "https://huggingface.co/datasets/suryadv/gpic-bcc-sam3-qwen38-27b"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
